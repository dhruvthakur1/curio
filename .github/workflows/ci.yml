name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t curio-api ./server
      - name: Container answers on /api/health and /api/recommend
        run: |
          docker run -d --name api -p 8000:8000 -e CLIENT_URL=http://localhost:5174 curio-api
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/recommend -H 'Content-Type: application/json' -d '{"persona":"retro","k":3}' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['mode']=='hybrid' and len(d['items'])==3, d; print('ok', [i['title'] for i in d['items']])"
          docker stats --no-stream api
